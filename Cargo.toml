[package]
name = "djeli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "djeli"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
futures-util = "0.3"
async-stream = "0.3"
tokenizers = "0.22"
minijinja = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive", "env"] }
ureq = { version = "2", features = ["json", "tls"] }

# To enable GPU support, uncomment the features below.
# For Nvidia CUDA: features = ["cuda"]
# For Apple Silicon: features = ["metal"]
candle-core = { version = "0.10.2", features = [] }
candle-nn = { version = "0.10.2", features = [] }
candle-transformers = { version = "0.10.2", features = [] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1