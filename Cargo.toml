[package]
name = "djeli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "djeli"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
futures-util = "0.3"
async-stream = "0.3"
candle-core = "0.10.2"
candle-nn = "0.10.2"
candle-transformers = "0.10.2"
tokenizers = "0.22"
minijinja = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive", "env"] }
ureq = { version = "2", features = ["json", "tls"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1